name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to create or update'
        required: true
        default: 'v1.0.0'
        type: string
      source_ref:
        description: 'Source ref to rebuild; use the tag normally, main for an authorized republish'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.event.release.tag_name || github.ref_name }}

      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          $package = Get-Content -Raw tooth.json | ConvertFrom-Json
          if ($env:RELEASE_TAG -cne "v$($package.version)") {
            throw 'Release tag must match tooth.json version with a v prefix'
          }

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: ~/AppData/Local/.xmake
          key: xmake-release-client-${{ hashFiles('xmake.lua', 'tooth.json') }}
          restore-keys: |
            xmake-release-client-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - name: Configure client release
        run: xmake f -a x64 -m release -p windows --target_type=client -y

      - name: Build
        run: xmake -r -y

      - name: Package and verify
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: ./scripts/Package-Release.ps1 -Tag $env:RELEASE_TAG

      - uses: actions/upload-artifact@v7
        with:
          name: BedrockBoatHUD-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
          path: |
            build/release/BedrockBoatHUD-client-windows-x64.zip
            build/release/tooth.json
            build/release/SHA256SUMS.txt

      - name: Publish release notes and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          $releaseTitle = (Get-Content -Raw build/release/release-title.txt).Trim()
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --verify-tag --title $releaseTitle --notes-file build/release/release-notes.md
          } else {
            gh release edit $env:RELEASE_TAG --title $releaseTitle --notes-file build/release/release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or notes update failed' }
          gh release upload $env:RELEASE_TAG build/release/BedrockBoatHUD-client-windows-x64.zip build/release/tooth.json build/release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
