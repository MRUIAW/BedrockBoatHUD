name: Build

on:
  pull_request:
  push:
  workflow_dispatch:
  
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: xmake-io/github-action-setup-xmake@v1
        # with:
        #   xmake-version: branch@master
      
      - uses: actions/cache@v6
        with:
          path: |
            ~/AppData/Local/.xmake
          key: xmake-${{ hashFiles('xmake.lua', 'tooth.json') }}
          restore-keys: |
            xmake-

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 22

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m release -p windows --target_type=client -y

      - run: |
          xmake -v -y

      - name: Validate release package
        shell: pwsh
        run: ./scripts/Package-Release.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ github.sha }}-client-windows-x64
          path: |
            build/release/BoatHUD-client-windows-x64.zip
            build/release/BedrockBoatHUD-client-windows-x64.zip
            build/release/tooth.json
            build/release/SHA256SUMS.txt
